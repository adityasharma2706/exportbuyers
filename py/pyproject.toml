[project]
name = "kp"
version = "0.0.0"
description = "Knowledge plane (R3) for Export Buyer Discovery"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "redis>=5.0",
  "boto3>=1.34",
  "opentelemetry-api>=1.25",
  "fastapi>=0.111",
  "pyyaml>=6.0",
  "phonenumbers>=8.13",
  "idna>=3.7",
  "openpyxl>=3.1",
  "rapidfuzz>=3.9",
  "unidecode>=1.3",
  "pycountry>=24.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "import-linter>=2.0", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kp*"]

# LLD §0.1: a module may import another module only through its package __init__.
[tool.importlinter]
root_package = "kp"

[[tool.importlinter.contracts]]
name = "Modules import each other only through their public __init__"
type = "forbidden"
source_modules = ["kp"]
forbidden_modules = ["kp.m01_platform.cost", "kp.m01_platform.budget", "kp.m01_platform.config",
                     "kp.m01_platform.errors", "kp.m01_platform.logs", "kp.m01_platform.tracing",
                     "kp.m01_platform.ids", "kp.m01_platform.secrets"]
ignore_imports = ["kp.m01_platform.** -> kp.m01_platform.**"]
allow_indirect_imports = true

[tool.pytest.ini_options]
testpaths = ["kp"]
