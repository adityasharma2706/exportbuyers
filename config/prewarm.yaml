# M20 Web discovery — pre-warm plan (LLD M20 "Pre-warm"). [tunable]
#
# A weekly schedule (m20.prewarm) enqueues one m20.discover job per country × heading below, with
# reason 'prewarm'. Jobs share the daily idempotency key disc:<heading>:<country>:<yyyy-mm-dd>
# with on-demand requests, so a cell is never discovered twice on the same day.
#
# countries: launch countries (UK, DE, NL, UAE) plus US, as ISO 3166-1 alpha-2 codes.
# headings:  the 50 most-searched HS headings (4 digits). [assumption] Seeded from India's top export
#            headings until search logs exist; replace with the search-log top 50 by PR.
# spread_hours: jobs are staggered evenly over this many hours after the schedule fires.

cron: "0 1 * * 0"   # Sundays 01:00 UTC
spread_hours: 24

countries: [GB, DE, NL, AE, US]

headings:
