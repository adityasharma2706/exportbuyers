# M19 curated list of freight forwarders, carriers, customs brokers and other logistics entities
# (LLD M19 step 1). A company whose primary domain (or a sub-domain of it) is listed under
# `domains`, or whose normalised name equals / starts with a listed name, is flagged
# `logistics_flag` with confidence 1.0 and hidden from buyer results by M10 (not deleted).
#
# Names are normalised with the M17/M18 name normaliser (lower-case, transliterated, legal
# suffixes removed), so "Kuehne + Nagel (UK) Ltd" matches the entry "Kuehne + Nagel".
# Changes are made by pull request; the classifier re-reads this file when it changes.
